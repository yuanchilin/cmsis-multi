solution:
  packs:
    - pack: ARM::CMSIS
    - pack: ARM::Cortex_DFP
  target-types:
    - type: Board
      device: ARMCM3
  build-types:
    - type: Debug
      compiler: GCC
      optimize: none
      debug: on
    - type: Release
      compiler: GCC
      optimize: balanced
      debug: off
    - type: Debug-LLVM
      compiler: CLANG
      optimize: none
      debug: on
    - type: Release-LLVM
      compiler: CLANG
      optimize: balanced
      debug: off
  projects:
    - project: ./multi.cproject.yml
